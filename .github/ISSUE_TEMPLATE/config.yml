blank_issues_enabled: true
contact_links:
  - name: Documentation
    url: https://motiq.dev
    about: Browse the catalog, live previews, and install commands.
  - name: Ask a question / get help
    url: https://github.com/RMahammad/motiq/discussions/categories/help
    about: Install problems, Tailwind v4 or RSC setup, "how do I do X with this component".
  - name: Request a component
    url: https://github.com/RMahammad/motiq/discussions/categories/component-requests
    about: Suggest a component or workflow the catalog is missing — describe the product problem, not just the effect.
  - name: Show and tell
    url: https://github.com/RMahammad/motiq/discussions/categories/show-and-tell
    about: Share what you built with Motiq.
  - name: Accessibility feedback
    url: https://github.com/RMahammad/motiq/discussions/categories/accessibility-feedback
    about: Screen-reader, keyboard, contrast, or reduced-motion problems. A confirmed a11y defect should be filed as a bug instead.
