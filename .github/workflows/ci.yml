name: CI

# paths-ignore skips runs only for files no CI check consumes. README.md,
# CONTRIBUTING.md, AGENTS.md and LAUNCH.md are deliberately NOT listed: they carry
# the catalog counts that check-catalog-counts.mjs verifies, so skipping CI for a
# doc-only edit is exactly how a stale count would slip through.
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - LICENSE
      - .github/assets/**
  pull_request:
    paths-ignore: *docs-only

# Least privilege for GITHUB_TOKEN: nothing here writes to the repository, so a
# compromised dependency in a build step gets a read-only token (OpenSSF Scorecard
# "Token-Permissions"). A job that needs more must ask for it explicitly.
permissions:
  contents: read

# Auto-cancel a superseded run when new commits land on the same branch/PR, so rapid
# pushes don't queue up full builds behind each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# pnpm 11's verify-deps-before-run pre-check can fail when a native dep (sharp) has an
# un-built script; disable it in CI (native builds are allow-listed in pnpm-workspace.yaml).
env:
  npm_config_verify_deps_before_run: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Single source of truth for the supported floor (README + CONTRIBUTING
          # + package.json engines all state 22.13); CI proves that floor works.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Documentation consistency (deterministic; see docs/tooling/README.md)
      - run: node docs/tooling/check-links.mjs
      - run: node docs/tooling/check-adr-index.mjs
      - run: node docs/tooling/check-duplicate-titles.mjs
      - run: node docs/tooling/check-stale-dates.mjs
      - run: node docs/tooling/check-inventory.mjs
      - run: node docs/tooling/check-catalog-counts.mjs
      # Fails when a component's preview moves over time but nothing documents how the
      # app feeds it — the gap that makes a correct install look broken.
      - run: node scripts/check-live-drivers.mjs
      # The guide's code is generated from a typechecked file; fail if it drifted.
      - run: node scripts/sync-guide-examples.mjs --check

      # Code gates
      - run: pnpm lint            # import-boundary firewall (docs/03)
      - run: pnpm typecheck       # strict TS
      - run: pnpm build           # tsdown; preserves "use client"
      - run: pnpm test            # vitest (unit + SSR + reduced-motion + axe)
      - run: pnpm check:exports   # publint (export-map correctness)
      - run: pnpm size            # size-limit budgets (docs/13)

  fixtures:
    # Proves the built library is consumable in real apps (App Router RSC + Vite).
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Single source of truth for the supported floor (README + CONTRIBUTING
          # + package.json engines all state 22.13); CI proves that floor works.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter playground-next build
      - run: pnpm --filter playground-vite build
      # Docs site (dogfoods the library; renders live component pages; docs/15).
      - run: pnpm --filter docs-site build
      # Static Storybook build (catalog previews; docs/15).
      - run: pnpm --filter storybook-app build-storybook
      # Packed-artifact consumer: install the tarballs (not source), verify resolution +
      # "use client" + SSR across packages. Registry-free (docs/14).
      - run: bash fixtures/tarball-consumer/verify.sh

# Planned (Phase 1+): size-limit budgets, publint/attw export validation, Storybook +
# Playwright visual/mobile, changesets release job. See docs/14 and docs/18.
